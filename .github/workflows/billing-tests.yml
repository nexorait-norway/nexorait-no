name: Billing webhook tests
on:
  pull_request:
    paths:
      - 'billing/**'
      - '.github/workflows/billing-tests.yml'
  push:
    branches:
      - feature/stripe-billing-foundation
    paths:
      - 'billing/**'
      - '.github/workflows/billing-tests.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile billing module
        run: python -m compileall -q billing
      - name: Run unit tests
        run: python -m unittest discover -s billing -p 'test_*.py' -v
