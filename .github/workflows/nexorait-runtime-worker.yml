name: Deploy nexorait-runtime worker

on:
  workflow_dispatch:
  push:
    branches:
      - runtime/nexorait-runtime-worker

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Wrangler 4
        run: npm install --no-save wrangler@4

      - name: Verify Cloudflare token
        working-directory: runtime-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || '3c4b065adf2430f01be6bd9fe2430ca3' }}
        run: |
          set -euo pipefail
          echo '' | base64 -d > /tmp/cf-verify.mjs
          node /tmp/cf-verify.mjs

      - name: Ensure D1 database
        working-directory: runtime-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || '3c4b065adf2430f01be6bd9fe2430ca3' }}
        run: |
          set -euo pipefail
          echo '' | base64 -d > /tmp/cf-d1.mjs
          node /tmp/cf-d1.mjs

      - name: Deploy nexorait-runtime worker
        working-directory: runtime-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || '3c4b065adf2430f01be6bd9fe2430ca3' }}
        run: |
          set -euo pipefail
          echo '' | base64 -d > /tmp/cf-deploy.mjs
          node /tmp/cf-deploy.mjs

